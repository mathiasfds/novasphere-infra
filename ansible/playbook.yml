---
- name: Configuration du serveur web NovaSphere
  hosts: webservers             # TODO 2 : Le groupe de ton inventaire
  become: true                  # Exécuter en sudo
  tasks:
    - name: Mettre à jour le cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer Nginx
      ansible.builtin.apt:
        name: nginx             # TODO 3 : Le package à installer
        state: present

    - name: S'assurer que Nginx est démarré et activé au boot
      ansible.builtin.service:
        name: nginx
        state: started           # TODO 4 : L'état "démarré"
        enabled: true

    - name: Déployer la page d'accueil NovaSphere
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>NovaSphere</title></head>
          <body>
          <h1>Bienvenue sur NovaSphere</h1>
          <p>Serveur configuré automatiquement par Ansible.</p>
          <p>Environnement : dev</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: "0644"
# ... (début du playbook identique)
    - name: Déployer la page d'accueil NovaSphere
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          # ... (contenu HTML)
        owner: www-data
        group: www-data
        mode: "0644"
      notify: Redémarrer Nginx # TODO 5 : On appelle le handler par son nom

  handlers:
    - name: Redémarrer Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted # TODO 6 : L'état pour un redémarrage
