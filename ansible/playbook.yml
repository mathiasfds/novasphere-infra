---
- name: Configuration industrielle du serveur web NovaSphere
  hosts: webservers
  become: true
  tasks:
    - name: Mettre à jour le cache APT
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets requis (Boucle S06)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: "{{ packages }}"

    - name: S'assurer que Nginx est démarré
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Déployer la page d'accueil (Template Jinja2 S06)
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ nginx_root }}/index.html"
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Installer les outils de debug (Condition S06)
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: [strace, tcpdump, net-tools]
      when: env == "dev"

    - name: Créer les utilisateurs applicatifs (Dictionnaire S06)
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        shell: "{{ item.shell }}"
        create_home: true
        state: present
      loop: "{{ app_users }}"

  handlers:
    - name: Redémarrer Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
